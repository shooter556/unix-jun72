; Unix V1 cold install from a host-built init DECtape
set cpu 11/20
set cpu 32K
; /usr lives on the RK05; cold init does not touch it, normal init mounts it
att rk0 images/rk0.dsk
; Must be 2 platters: vcboot's last RF write ends exactly at the end of
; platter 1, which SIMH reports as "nonexistent disk" on a 1-platter RF
set rf 2p
set rf enabled
; A fresh, empty RF image (SIMH creates it)
att rf images/rf0-new.dsk
set tc enabled
; The cold-boot init reads its files from tap0
att tc0 images/inittape
; HK overlaps the RF11 register addresses
set hk disabled
set ke enabled
; Terminal lines, same as the normal configuration
set dci en
set dci lines=8
set dco 7b
att dci 5555
; SR=1 tells bos to load Cold UNIX
dep system sr 1
; SIMH's TC bootstrap reads tape block 0 (vcboot) into location 0 and runs it
boot tc0
